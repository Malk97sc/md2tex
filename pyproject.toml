[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md2tex"
version = "0.2.0"
description = "A simple and customizable Markdown to LaTeX CLI conversion tool"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
authors = [
    { name = "Paul Hector Kervegan" },
    { name = "Malak" },
]
keywords = ["markdown", "latex", "tex", "converter", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
tui = ["textual>=0.52.0"]

[project.scripts]
md2tex = "md2tex.cli:md2tex"

[project.urls]
Homepage = "https://github.com/paulhectork/md2tex"
Repository = "https://github.com/paulhectork/md2tex"

[tool.hatch.build.targets.wheel]
packages = ["src/md2tex"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B904",   # raise without from (existing pattern in codebase)
    "SIM108", # ternary operator (readability preference)
    "RUF012", # mutable class var (used as constants, not mutated)
]

[tool.ruff.lint.isort]
known-first-party = ["md2tex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
mypy_path = "src"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]
